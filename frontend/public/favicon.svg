<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#A855F7" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="64" height="64" rx="14" fill="#0D0D0D"/>

  <!-- Ambient glow -->
  <ellipse cx="32" cy="32" rx="28" ry="28" fill="url(#glow)" filter="url(#blur)"/>

  <!-- Face profile silhouette (left side) — simplified head outline -->
  <!-- Head circle top -->
  <path d="M14 26 C14 15 22 10 30 12 C26 13 23 17 23 22 L23 36 C23 40 25 43 28 44 L20 44 C16 42 14 38 14 34 Z"
        fill="url(#g1)" opacity="0.9"/>

  <!-- Neck -->
  <rect x="24" y="44" width="5" height="5" rx="1" fill="url(#g1)" opacity="0.7"/>

  <!-- Sound wave bars (right side) — 5 bars with varying heights -->
  <rect x="33" y="27" width="4" height="10" rx="2" fill="url(#g1)" opacity="0.95"/>
  <rect x="39" y="22" width="4" height="20" rx="2" fill="url(#g1)" opacity="0.95"/>
  <rect x="45" y="25" width="4" height="14" rx="2" fill="url(#g1)" opacity="0.95"/>
  <rect x="51" y="29" width="4" height="6"  rx="2" fill="url(#g1)" opacity="0.85"/>

  <!-- Connecting horizontal bridge (emotion → music) -->
  <line x1="28" y1="32" x2="33" y2="32" stroke="url(#g1)" stroke-width="1.5" opacity="0.6"/>
</svg>