<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" fill="none">
  <defs>
    <linearGradient id="mm-bg-grad" x1="24" y1="24" x2="232" y2="232" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0E131F"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>
    <linearGradient id="mm-accent-cyan" x1="40" y1="40" x2="216" y2="216" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38EF7D"/>
      <stop offset="50%" stop-color="#11998E"/>
      <stop offset="100%" stop-color="#38EF7D"/>
    </linearGradient>
    <linearGradient id="mm-wave-grad" x1="80" y1="60" x2="176" y2="196" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00F2FE"/>
      <stop offset="100%" stop-color="#4FACFE"/>
    </linearGradient>
    <linearGradient id="mm-amber-glow" x1="128" y1="80" x2="128" y2="176" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F6D365"/>
      <stop offset="100%" stop-color="#FDA085"/>
    </linearGradient>
    <filter id="mm-subtle-glow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Container Base -->
  <rect x="16" y="16" width="224" height="224" rx="48" fill="url(#mm-bg-grad)"/>
  <rect x="16" y="16" width="224" height="224" rx="48" stroke="#1E293B" stroke-width="2"/>

  <!-- Outer Mirror Ring -->
  <circle cx="128" cy="128" r="82" stroke="url(#mm-wave-grad)" stroke-width="2.5" opacity="0.4"/>
  <circle cx="128" cy="128" r="70" stroke="url(#mm-wave-grad)" stroke-width="1.5" stroke-dasharray="4 6" opacity="0.6"/>

  <!-- Left Symmetrical Acoustic Wave (Reflection) -->
  <path d="M102 78 C80 92 68 109 68 128 C68 147 80 164 102 178" stroke="url(#mm-wave-grad)" stroke-width="5" stroke-linecap="round"/>
  <path d="M112 96 C100 105 94 116 94 128 C94 140 100 151 112 160" stroke="url(#mm-wave-grad)" stroke-width="4" stroke-linecap="round" opacity="0.85"/>

  <!-- Right Symmetrical Acoustic Wave (Mirror) -->
  <path d="M154 78 C176 92 188 109 188 128 C188 147 176 164 154 178" stroke="url(#mm-wave-grad)" stroke-width="5" stroke-linecap="round"/>
  <path d="M144 96 C156 105 162 116 162 128 C162 140 156 151 144 160" stroke="url(#mm-wave-grad)" stroke-width="4" stroke-linecap="round" opacity="0.85"/>

  <!-- Central Acoustic Axis (Dynamic Soundwave Bars) -->
  <line x1="128" y1="62" x2="128" y2="194" stroke="url(#mm-amber-glow)" stroke-width="4" stroke-linecap="round" filter="url(#mm-subtle-glow)"/>
  <circle cx="128" cy="128" r="9" fill="url(#mm-amber-glow)"/>
  <circle cx="128" cy="98" r="4" fill="url(#mm-wave-grad)"/>
  <circle cx="128" cy="158" r="4" fill="url(#mm-wave-grad)"/>
</svg>
