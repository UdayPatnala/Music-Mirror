<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="fav-bg" x1="4" y1="4" x2="60" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0E131F"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>
    <linearGradient id="fav-wave" x1="16" y1="16" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00F2FE"/>
      <stop offset="100%" stop-color="#4FACFE"/>
    </linearGradient>
    <linearGradient id="fav-pulse" x1="32" y1="14" x2="32" y2="50" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F6D365"/>
      <stop offset="100%" stop-color="#FDA085"/>
    </linearGradient>
  </defs>

  <!-- Favicon Container -->
  <rect width="64" height="64" rx="14" fill="url(#fav-bg)"/>
  <rect width="64" height="64" rx="14" stroke="#1E293B" stroke-width="1.5"/>

  <!-- Mirror Arc Waves -->
  <path d="M22 18 C14 24 10 32 10 40 C10 48 14 56 22 62" stroke="url(#fav-wave)" stroke-width="2.5" stroke-linecap="round" opacity="0.3"/>
  <path d="M25 21 C18 26 15 32 15 40 C15 48 18 54 25 59" stroke="url(#fav-wave)" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  <path d="M27 25 C23 29 20 34 20 40 C20 46 23 51 27 55" stroke="url(#fav-wave)" stroke-width="2.2" stroke-linecap="round"/>

  <path d="M37 25 C41 29 44 34 44 40 C44 46 41 51 37 55" stroke="url(#fav-wave)" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M39 21 C46 26 49 32 49 40 C49 48 46 54 39 59" stroke="url(#fav-wave)" stroke-width="2" stroke-linecap="round" opacity="0.6"/>

  <!-- Center Equalizer / Axis -->
  <line x1="32" y1="14" x2="32" y2="50" stroke="url(#fav-pulse)" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="32" cy="32" r="3.5" fill="url(#fav-pulse)"/>
</svg>